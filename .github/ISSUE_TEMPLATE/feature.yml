name: Idea for a feature
description: Something Tandem could do
labels: [idea]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to do?
      description: Describe the situation, not just the feature. "When I'm on a call, I want…"
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
