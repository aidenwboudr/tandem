plugins {
    id 'com.android.application'
}

// Release signing key lives outside the repo (see build.sh). Without it, release builds are unsigned.
def ks = System.getenv("TANDEM_KEYSTORE") ?: "${System.getProperty('user.home')}/.config/tandem/android-release.jks"

android {
    namespace 'com.aidenwb.tandem'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aidenwb.tandem'
        minSdk 33
        targetSdk 35
        versionCode 11
        versionName '3.1.1'
    }

    signingConfigs {
        release {
            storeFile file(ks)
            storePassword System.getenv("TANDEM_KEYSTORE_PASS") ?: "tandem"
            keyAlias "tandem"
            keyPassword System.getenv("TANDEM_KEYSTORE_PASS") ?: "tandem"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (file(ks).exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ScreensTest renders the real screens on the JVM (Robolectric, native graphics) into build/screens.
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
