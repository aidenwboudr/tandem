# Don't offer the laptop to phones as a hands-free unit (hfp_hf / hsp_hs).
# Added 2026-10-04 for tandem: when the phone plays through the laptop over A2DP it also opened a
# hands-free link to it, and dropping that link (so calls wouldn't land on the laptop) made Android move ALL
# of the phone's audio back to the headphones. Without the role the phone links A2DP only: music goes to the
# laptop, calls stay on the headphones. The headphones' own mic is unaffected (that's hfp_ag, kept).
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hfp_ag hsp_ag ]
}
